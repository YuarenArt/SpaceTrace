[pytest]
testpaths = test
python_files = test_*.py
addopts = -ra -p no:cacheprovider
norecursedirs = benchmark
markers =
    unit: isolated logic and validation
    integration: real PyQGIS data processing and persistence
    ui: Qt widget interaction without a running QGIS main window
    e2e: plugin loaded into a real QGIS process
    benchmark: optional performance checks
