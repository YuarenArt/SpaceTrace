name: Lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: qgis-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lint tools
        run: python -m pip install -r requirements-lint.txt
      - name: Check Python
        run: python -m ruff check --no-cache src scripts test __init__.py
      - name: Check QGIS conventions
        run: python -m flake8 src

  qgis4-compatibility:
    name: PyQGIS 4 compatibility report
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qgis/pyqgis4-checker:main-ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: Check plugin code for QGIS 4
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d "${RUNNER_TEMP}/spacetrace-qgis4.XXXXXX")"
          trap 'rm -rf "$workdir"' EXIT
          cp -R src test scripts "$workdir/"
          cp __init__.py resources.py "$workdir/"

          # The checker edits files in normal mode, so both runs use a disposable copy.
          # Dry-run creates the detailed report but does not fail for findings.
          pyqt5_to_pyqt6.py --dry_run --logfile "$RUNNER_TEMP/qgis4-checker.log" "$workdir"
          cat "$RUNNER_TEMP/qgis4-checker.log"

          # Normal mode returns a failing status for findings and edits only the copy.
          pyqt5_to_pyqt6.py "$workdir"
      - name: Upload QGIS 4 compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qgis4-compatibility-report
          path: ${{ runner.temp }}/qgis4-checker.log
          if-no-files-found: warn
          retention-days: 7
